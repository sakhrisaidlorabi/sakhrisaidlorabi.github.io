<style>
:root{
  --bg:#EDEFEE; --surface:#FBFCFB; --surface-2:#E4E8E6;
  --text:#101718; --muted:#57666A; --faint:#8A989C;
  --line:#CFD7D5; --line-strong:#AFBAB8;
  --accent:#A3550C; --accent-ink:#FFF7EE;
  --ok:#2C7A58;
  --shadow:0 1px 0 rgba(16,23,24,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1012; --surface:#111A1D; --surface-2:#162126;
    --text:#E4EBEB; --muted:#8FA2A6; --faint:#6B7C80;
    --line:#1E2A2E; --line-strong:#2C3C41;
    --accent:#F0A24B; --accent-ink:#17120A;
    --ok:#56BC8C;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1012; --surface:#111A1D; --surface-2:#162126;
  --text:#E4EBEB; --muted:#8FA2A6; --faint:#6B7C80;
  --line:#1E2A2E; --line-strong:#2C3C41;
  --accent:#F0A24B; --accent-ink:#17120A;
  --ok:#56BC8C;
  --shadow:none;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans","Noto Kufi Arabic",system-ui,Segoe UI,Arial,sans-serif;
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{width:min(1080px,100%);margin-inline:auto;padding-inline:24px}
@media(max-width:560px){.wrap{padding-inline:16px}}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-block-end:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:60px}
.mark{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 110,"wght" 800;letter-spacing:.06em;font-size:15px}
.mark i{color:var(--accent);font-style:normal}
.navlinks{display:flex;gap:22px;margin-inline-start:auto}
.navlinks a{color:var(--muted);text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-block:6px;border-block-end:1px solid transparent}
.navlinks a:hover{color:var(--text);border-block-end-color:var(--accent)}
.editbtn{font-family:"Noto Kufi Arabic","IBM Plex Sans",sans-serif;font-size:13px;font-weight:600;padding:7px 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:3px;cursor:pointer}
.editbtn:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:760px){.navlinks{display:none}.editbtn{margin-inline-start:auto}}

/* hero */
.hero{padding-block:72px 64px;display:grid;grid-template-columns:1.35fr .65fr;gap:48px;align-items:start;border:0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--accent);flex:none}
h1{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 96,"wght" 800;font-size:clamp(40px,6.4vw,74px);line-height:.98;letter-spacing:-.02em;margin:20px 0 0;text-wrap:balance}
h1 .role{display:block;color:var(--accent);font-variation-settings:"wdth" 92,"wght" 600;font-size:.44em;letter-spacing:.01em;margin-top:14px;line-height:1.2}
.tagline{color:var(--muted);font-size:17px;max-width:56ch;margin:22px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.btn{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;padding:12px 20px;border:1px solid var(--line-strong);border-radius:3px;color:var(--text);display:inline-block}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn:hover{border-color:var(--accent)}

.panel{border:1px solid var(--line);background:var(--surface);border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.panel-top{display:flex;align-items:center;gap:9px;padding:11px 16px;border-block-end:1px solid var(--line);background:var(--surface-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;animation:blip 2.6s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.35}}
.panel-top b{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400}
.panel-row{display:flex;justify-content:space-between;gap:14px;padding:11px 16px;border-block-end:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.panel-row:last-child{border-block-end:0}
.panel-row b{color:var(--faint);font-weight:400;letter-spacing:.04em;text-transform:uppercase;font-size:11px;padding-top:1px;flex:none}
.panel-row em{font-style:normal;color:var(--text);text-align:end}
@media(max-width:860px){.hero{grid-template-columns:1fr;gap:34px;padding-block:52px 48px}}

/* sections */
section{padding-block:56px;border-block-start:1px solid var(--line)}
.sechead{display:flex;align-items:baseline;gap:14px;margin-bottom:28px;flex-wrap:wrap}
.sechead .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.sechead .tag::before{content:"\25A0";color:var(--accent);margin-inline-end:8px;font-size:9px;vertical-align:1px}
h2{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 98,"wght" 700;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.015em;margin:0;line-height:1.1}
.prose p{color:var(--muted);max-width:66ch;margin:0 0 14px}
.prose p:last-child{margin-bottom:0}

/* experience */
.tl{display:grid;gap:0}
.tl .row{display:grid;grid-template-columns:170px 1fr;gap:28px;padding-block:22px;border-block-start:1px dashed var(--line)}
.tl .row:first-child{border-block-start:0;padding-block-start:0}
.period{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);padding-top:5px}
.tl h3{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 95,"wght" 650;font-size:19px;margin:0;letter-spacing:-.005em}
.org{color:var(--faint);font-size:14px;margin:2px 0 8px}
.tl p.d{color:var(--muted);margin:0;max-width:62ch;font-size:15px}
@media(max-width:700px){.tl .row{grid-template-columns:1fr;gap:6px}.period{padding-top:0}}

/* projects */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.card{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:Archivo,system-ui,sans-serif;font-variation-settings:"wdth" 95,"wght" 700;font-size:20px;margin:0;letter-spacing:-.01em}
.card p{color:var(--muted);margin:0;font-size:15px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);padding:3px 8px;border-radius:2px}
.card a{color:var(--accent);text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.05em;border-block-end:1px solid currentColor;align-self:flex-start;padding-block-end:1px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px 34px}
.sk h3{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;padding-block-end:8px;border-block-end:1px solid var(--line)}
.sk ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.sk li{color:var(--muted);font-size:14.5px;display:flex;gap:9px}
.sk li::before{content:"\2014";color:var(--faint);flex:none}

/* contact */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-top:24px}
.contact a,.contact .ci{background:var(--surface);padding:20px 22px;text-decoration:none;color:var(--text);display:block}
.contact a:hover{background:var(--surface-2)}
.contact b{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:400;margin-bottom:5px}
.contact span{font-size:15.5px;word-break:break-word}
.contact a span{color:var(--accent)}
.note{color:var(--faint);font-size:13px;margin-top:14px}

footer{border-block-start:1px solid var(--line);padding-block:28px 40px;color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* editor drawer */
    .editbtn, #editor, #scrim { display: none !important; }
#scrim{position:fixed;inset:0;background:rgba(6,10,11,.45);z-index:50;opacity:0;transition:opacity .2s}
#scrim.on{opacity:1}
#editor{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);z-index:51;background:var(--bg);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease;direction:rtl;font-family:"Noto Kufi Arabic","IBM Plex Sans",sans-serif}
#editor.on{transform:none}
.ed-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-block-end:1px solid var(--line);background:var(--surface)}
.ed-head h2{font-family:"Noto Kufi Arabic",sans-serif;font-variation-settings:normal;font-size:16px;font-weight:600;margin:0;flex:1;letter-spacing:0}
.ed-head button{background:none;border:1px solid var(--line-strong);color:var(--muted);border-radius:3px;cursor:pointer;font-size:15px;line-height:1;padding:7px 11px;font-family:inherit}
.ed-body{flex:1;overflow-y:auto;padding:18px;padding-block-end:40px;display:grid;gap:18px;align-content:start}
.ed-note{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--accent);border-radius:3px;padding:11px 13px;line-height:1.85}
.ed-note code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--text)}
.grp{border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.grp>summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:9px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"\25BE";color:var(--accent);font-size:11px}
.grp:not([open])>summary::before{content:"\25B8"}
.grp .inner{padding:0 14px 14px;display:grid;gap:12px}
.f{display:grid;gap:5px}
.f label{font-size:11.5px;color:var(--faint)}
.f input,.f textarea,.f select{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--text)}
.f textarea{min-height:66px;resize:vertical;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus,.mini:focus-visible,.editbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.item{border:1px solid var(--line);border-radius:3px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.item .top{display:flex;align-items:center;gap:6px}
.item .top strong{font-size:12px;color:var(--faint);font-weight:600;flex:1}
.mini{font:inherit;font-size:11.5px;padding:4px 9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);border-radius:3px;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.add{width:100%;padding:9px;color:var(--accent);border-style:dashed}
.ed-foot{border-block-start:1px solid var(--line);background:var(--surface);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;padding-block-end:calc(12px + env(safe-area-inset-bottom,0px))}
.ed-foot button{flex:1;min-width:110px;font:inherit;font-size:13px;font-weight:600;padding:10px;border-radius:3px;cursor:pointer;border:1px solid var(--line-strong);background:var(--bg);color:var(--text)}
.ed-foot button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#jsonbox{width:100%;min-height:150px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;direction:ltr;text-align:left;padding:10px;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--text);line-height:1.5}
#toast{position:fixed;inset-block-end:22px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;z-index:60;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:4px;font-size:13.5px;font-family:"Noto Kufi Arabic",sans-serif;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>

<script>
(function(){
  "use strict";
  var KEY = "personal-site-data-v1";
  var SEED = JSON.parse(document.getElementById("site-data").textContent);
  var D = clone(SEED);

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function load(){
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e){} }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }
  function list(str){
    return String(str || "").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
  }

  /* tab icon drawn from the initials, so it follows the name */
  function setFavicon(initials){
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
      '<rect width="64" height="64" rx="11" fill="#0A1012"/>' +
      '<text x="32" y="43" text-anchor="middle" fill="#F0A24B" ' +
      'font-family="Archivo,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">' +
      esc(String(initials || "").slice(0, 3)) + '</text></svg>';
    var el = document.querySelector('link[rel="icon"]');
    if (!el) {
      el = document.createElement("link");
      el.rel = "icon";
      (document.head || document.documentElement).appendChild(el);
    }
    el.type = "image/svg+xml";
    el.href = "data:image/svg+xml," + encodeURIComponent(svg);
  }

  /* ---------- render ---------- */
  function render(){
    var c = D.contact || {};
    var rtl = D.lang === "ar";
    document.title = D.name || "Personal Site";
    setFavicon(D.initials);

    var nav = [["about","About"],["experience","Experience"],["projects","Projects"],["skills","Skills"],["contact","Contact"]];
    var h = "";

    h += '<header class="bar"><div class="wrap">';
    h +=   '<div class="mark">' + esc(D.initials) + '<i>.</i></div>';
    h +=   '<nav class="navlinks">' + nav.map(function(n){
             return '<a href="#' + n[0] + '">' + n[1] + '</a>'; }).join("") + '</nav>';
    h +=   '<button type="button" class="editbtn" id="open-editor">&#9998; تعديل</button>';
    h += '</div></header>';

    h += '<main dir="' + (rtl ? "rtl" : "ltr") + '"><div class="wrap">';

    h += '<section class="hero"><div>';
    h +=   '<div class="eyebrow">' + esc(D.eyebrow) + '</div>';
    h +=   '<h1>' + esc(D.name) + '<span class="role">' + esc(D.role) + '</span></h1>';
    h +=   '<p class="tagline">' + esc(D.tagline) + '</p>';
    h +=   '<div class="cta"><a class="btn solid" href="#contact">Contact</a>';
    h +=   '<a class="btn" href="#projects">Projects</a></div>';
    h += '</div><aside class="panel"><div class="panel-top"><span class="dot"></span><b>Profile</b></div>';
    h += (D.panel || []).map(function(p){
            return '<div class="panel-row"><b>' + esc(p.label) + '</b><em>' + esc(p.value) + '</em></div>';
          }).join("");
    h += '</aside></section>';

    h += '<section id="about"><div class="sechead"><div class="tag">Background</div><h2>About</h2></div>';
    h += '<div class="prose">' + (D.about || []).map(function(p){
            return '<p>' + esc(p) + '</p>'; }).join("") + '</div></section>';

    h += '<section id="experience"><div class="sechead"><div class="tag">Track record</div><h2>Experience</h2></div><div class="tl">';
    h += (D.experience || []).map(function(e){
            return '<div class="row"><div class="period">' + esc(e.period) + '</div><div>' +
                   '<h3>' + esc(e.title) + '</h3>' +
                   (e.org ? '<div class="org">' + esc(e.org) + '</div>' : '') +
                   '<p class="d">' + esc(e.desc) + '</p></div></div>';
          }).join("");
    h += '</div></section>';

    h += '<section id="projects"><div class="sechead"><div class="tag">Selected work</div><h2>Projects</h2></div><div class="cards">';
    h += (D.projects || []).map(function(p){
            return '<article class="card"><h3>' + esc(p.name) + '</h3><p>' + esc(p.desc) + '</p>' +
                   '<div class="chips">' + list(p.tags).map(function(t){
                      return '<span class="chip">' + esc(t) + '</span>'; }).join("") + '</div>' +
                   (p.link ? '<a href="' + esc(p.link) + '" target="_blank" rel="noopener">' +
                              esc(p.linkLabel || "Open") + ' →</a>' : '') + '</article>';
          }).join("");
    h += '</div></section>';

    h += '<section id="skills"><div class="sechead"><div class="tag">Capabilities</div><h2>Technical Skills</h2></div><div class="skills">';
    h += (D.skills || []).map(function(s){
            return '<div class="sk"><h3>' + esc(s.group) + '</h3><ul>' +
                   list(s.items).map(function(i){ return '<li>' + esc(i) + '</li>'; }).join("") +
                   '</ul></div>';
          }).join("");
    h += '</div></section>';

    h += '<section id="contact"><div class="sechead"><div class="tag">Get in touch</div><h2>Contact</h2></div>';
    h += '<div class="prose"><p>' + esc(c.intro) + '</p></div><div class="contact">';
    if (c.email)    h += '<a href="mailto:' + esc(c.email) + '"><b>Email</b><span>' + esc(c.email) + '</span></a>';
    if (c.phone)    h += '<a href="tel:' + esc(String(c.phone).replace(/[^+0-9]/g, "")) + '"><b>Phone / WhatsApp</b><span>' + esc(c.phone) + '</span></a>';
    if (c.linkedin) h += '<a href="' + esc(c.linkedin) + '" target="_blank" rel="noopener"><b>LinkedIn</b><span>' + esc(c.linkedinLabel || c.linkedin) + '</span></a>';
    if (c.location) h += '<div class="ci"><b>Location</b><span>' + esc(c.location) + '</span></div>';
    h += '</div>';
    if (c.note) h += '<p class="note">' + esc(c.note) + '</p>';
    h += '</section>';

    h += '<footer><span>&copy; ' + new Date().getFullYear() + ' ' + esc(D.name) + '</span>';
    h += '<span>' + esc(D.role) + '</span></footer>';
    h += '</div></main>';

    document.getElementById("app").innerHTML = h;
    document.getElementById("open-editor").addEventListener("click", openEditor);
  }

  /* ---------- editor ---------- */
  var FIELDS = {
    panel:      [["label","العنوان"],["value","القيمة"]],
    experience: [["period","الفترة / النوع"],["title","المسمى الوظيفي"],["org","الجهة"],["desc","الوصف","area"]],
    projects:   [["name","اسم المشروع"],["desc","الوصف","area"],["tags","الوسوم (افصل بفاصلة)"],["link","الرابط"],["linkLabel","نص الرابط"]],
    skills:     [["group","اسم المجموعة"],["items","المهارات (افصل بفاصلة)","area"]]
  };

  function field(label, value, path, type){
    var id = "f_" + path.replace(/[^a-z0-9]/gi, "_");
    var ctl = type === "area"
      ? '<textarea id="' + id + '" data-path="' + path + '">' + esc(value) + '</textarea>'
      : '<input id="' + id + '" data-path="' + path + '" value="' + esc(value) + '">';
    return '<div class="f"><label for="' + id + '">' + label + '</label>' + ctl + '</div>';
  }

  function listGroup(key, title, itemLabel){
    var f = FIELDS[key], arr = D[key] || [];
    var h = '<details class="grp"><summary>' + title + ' (' + arr.length + ')</summary><div class="inner">';
    h += arr.map(function(it, i){
      return '<div class="item"><div class="top"><strong>' + itemLabel + ' ' + (i + 1) + '</strong>' +
        '<button type="button" class="mini" data-move="' + key + ':' + i + ':-1" aria-label="أعلى">&#9650;</button>' +
        '<button type="button" class="mini" data-move="' + key + ':' + i + ':1" aria-label="أسفل">&#9660;</button>' +
        '<button type="button" class="mini" data-del="' + key + ':' + i + '">حذف</button></div>' +
        f.map(function(fd){ return field(fd[1], it[fd[0]], key + "." + i + "." + fd[0], fd[2]); }).join("") +
        '</div>';
    }).join("");
    h += '<button type="button" class="mini add" data-add="' + key + '">+ إضافة ' + itemLabel + '</button>';
    return h + '</div></details>';
  }

  function buildEditor(){
    var c = D.contact || {}, h = "";

    h += '<div class="ed-note">كل تعديل يظهر فورًا ويُحفظ في هذا المتصفح.<br>لتثبيته داخل الملف نهائيًا: اضغط <b>نسخ البيانات</b> ثم الصق المحتوى بدل ما بين وسمَي <code>&lt;script id="site-data"&gt;</code> في أعلى الملف.</div>';

    h += '<details class="grp" open><summary>الهوية والعنوان</summary><div class="inner">';
    h += field("الاسم الكامل", D.name, "name");
    h += field("الأحرف الأولى (الشعار)", D.initials, "initials");
    h += field("المسمى المهني", D.role, "role");
    h += field("السطر العلوي الصغير", D.eyebrow, "eyebrow");
    h += field("النبذة المختصرة", D.tagline, "tagline", "area");
    h += '<div class="f"><label for="f_lang">اتجاه المحتوى</label>' +
         '<select id="f_lang" data-path="lang">' +
         '<option value="en"' + (D.lang !== "ar" ? " selected" : "") + '>يسار ← يمين (إنجليزي / فرنسي)</option>' +
         '<option value="ar"' + (D.lang === "ar" ? " selected" : "") + '>يمين ← يسار (عربي)</option>' +
         '</select></div>';
    h += '</div></details>';

    h += '<details class="grp"><summary>نبذة عني (' + (D.about || []).length + ')</summary><div class="inner">';
    h += (D.about || []).map(function(p, i){
      return '<div class="item"><div class="top"><strong>فقرة ' + (i + 1) + '</strong>' +
             '<button type="button" class="mini" data-del="about:' + i + '">حذف</button></div>' +
             field("النص", p, "about." + i, "area") + '</div>';
    }).join("");
    h += '<button type="button" class="mini add" data-add="about">+ إضافة فقرة</button></div></details>';

    h += listGroup("panel", "بطاقة المعلومات السريعة", "سطر");
    h += listGroup("experience", "الخبرات", "خبرة");
    h += listGroup("projects", "المشاريع", "مشروع");
    h += listGroup("skills", "المهارات", "مجموعة");

    h += '<details class="grp" open><summary>جهات الاتصال</summary><div class="inner">';
    h += field("جملة تمهيدية", c.intro, "contact.intro", "area");
    h += field("البريد الإلكتروني", c.email, "contact.email");
    h += field("الهاتف / واتساب", c.phone, "contact.phone");
    h += field("رابط LinkedIn", c.linkedin, "contact.linkedin");
    h += field("النص الظاهر للرابط", c.linkedinLabel, "contact.linkedinLabel");
    h += field("الموقع الجغرافي", c.location, "contact.location");
    h += field("ملاحظة أسفل القسم (فرّغها لإخفائها)", c.note, "contact.note");
    h += '</div></details>';

    h += '<details class="grp"><summary>البيانات الخام (JSON)</summary><div class="inner">' +
         '<textarea id="jsonbox" spellcheck="false">' + esc(JSON.stringify(D, null, 2)) + '</textarea>' +
         '<button type="button" class="mini" id="ed-import">تطبيق ما في الصندوق</button></div></details>';

    document.getElementById("ed-body").innerHTML = h;
  }

  function setPath(path, value){
    var parts = path.split("."), o = D, i;
    for (i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }

  var body = document.getElementById("ed-body");

  body.addEventListener("input", function(e){
    var p = e.target.getAttribute("data-path");
    if (!p) return;
    setPath(p, e.target.value);
    save(); render();
    var box = document.getElementById("jsonbox");
    if (box && box !== e.target) box.value = JSON.stringify(D, null, 2);
  });

  body.addEventListener("change", function(e){
    if (e.target.id === "f_lang") { save(); render(); }
  });

  body.addEventListener("click", function(e){
    var t = e.target, v, a, m, arr, i, j, blank;
    if ((v = t.getAttribute("data-add"))) {
      if (v === "about") { D.about = D.about || []; D.about.push("نص جديد"); }
      else {
        blank = {};
        FIELDS[v].forEach(function(f){ blank[f[0]] = ""; });
        D[v] = D[v] || []; D[v].push(blank);
      }
    } else if ((v = t.getAttribute("data-del"))) {
      a = v.split(":"); D[a[0]].splice(Number(a[1]), 1);
    } else if ((v = t.getAttribute("data-move"))) {
      m = v.split(":"); arr = D[m[0]]; i = Number(m[1]); j = i + Number(m[2]);
      if (j < 0 || j >= arr.length) return;
      arr.splice(j, 0, arr.splice(i, 1)[0]);
    } else if (t.id === "ed-import") {
      try { D = JSON.parse(document.getElementById("jsonbox").value); }
      catch (err) { toast("صيغة JSON غير صحيحة"); return; }
      toast("تم التطبيق");
    } else return;
    save(); render(); buildEditor();
  });

  /* ---------- drawer ---------- */
  var scrim = document.getElementById("scrim");
  var drawer = document.getElementById("editor");

  function openEditor(){
    buildEditor();
    scrim.hidden = false; drawer.hidden = false;
    requestAnimationFrame(function(){ scrim.classList.add("on"); drawer.classList.add("on"); });
  }
  function closeEditor(){
    scrim.classList.remove("on"); drawer.classList.remove("on");
    setTimeout(function(){ scrim.hidden = true; drawer.hidden = true; }, 250);
  }
  scrim.addEventListener("click", closeEditor);
  document.getElementById("ed-close").addEventListener("click", closeEditor);
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && !drawer.hidden) closeEditor();
  });

  document.getElementById("ed-copy").addEventListener("click", function(){
    var txt = JSON.stringify(D, null, 2);
    function manual(){
      var g = document.getElementById("jsonbox");
      if (g) { g.parentNode.parentNode.open = true; g.focus(); g.select(); }
      toast("انسخ النص المحدَّد يدويًا");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ toast("تم نسخ البيانات"); }, manual);
    } else manual();
  });

  document.getElementById("ed-reset").addEventListener("click", function(){
    D = clone(SEED);
    try { localStorage.removeItem(KEY); } catch(e){}
    render(); buildEditor(); toast("تم استرجاع البيانات الأصلية");
  });

  /* download a ready-to-host copy, only when opened as a local file */
  var dl = document.getElementById("ed-dl");
  if (location.protocol === "file:") {
    dl.hidden = false;
    dl.addEventListener("click", function(){
      var src = document.documentElement.cloneNode(true);
      var tag = src.querySelector("#site-data");
      if (tag) tag.textContent = "\n" + JSON.stringify(D, null, 2) + "\n";
      var app = src.querySelector("#app"); if (app) app.innerHTML = "";
      var ttl = src.querySelector("title"); if (ttl) ttl.textContent = D.name || "Personal Site";
      var blob = new Blob(["<!doctype html>\n" + src.outerHTML], { type: "text/html" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      toast("تم تنزيل النسخة المحدَّثة");
    });
  }

  /* ---------- boot ---------- */
  function start(state){
    D = (state && state.data) || load() || clone(SEED);
    render();
  }
  if (window.claude && window.claude.hot) {
    if (window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return { data: D }; });
    if (window.claude.hot.ready) window.claude.hot.ready(start);
    else start(window.claude.hot.data || {});
  } else start({});
})();
</script>
